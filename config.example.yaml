capture:
  interval_seconds: 30
  output_dir: data/screenshots

dedup:
  phash_threshold: 8
  histogram_threshold: 0.98
  enable_histogram: true

embedding:
  enabled: false
  base_url: http://127.0.0.1:8000/v1
  model: text-embedding-3-small
  api_key: ""
  api_key_env: EMBEDDING_API_KEY
  threshold: 0.92

activity:
  merge_window_minutes: 3

vlm:
  provider: heuristic              # heuristic | openai_compatible
  base_url: http://127.0.0.1:8000/v1
  model: qwen2.5-vl-7b-instruct
  api_key: ""
  api_key_env: VLM_API_KEY
  max_retries: 2
  timeout: 120
  fallback_heuristic: true

# 对话模型：多后端按序探测，前一个失败自动切下一个
# 云端 DeepSeek（官方 OpenAI 兼容，key 见 platform.deepseek.com）
# 云端 智谱 GLM（open.bigmodel.cn，glm-4.7-flash 免费、高峰易限流，glm-4-flash 稳定兜底）
# 本地 = vLLM 部署千问系列（企业标准 serving）：vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000
chat:
  enabled: true
  max_tokens: 256
  max_history: 6
  timeout: 60
  backends:
    - name: deepseek-flash
      base_url: https://api.deepseek.com
      model: deepseek-flash              # DeepSeek-V4.1-Flash
      api_key: ""
      api_key_env: DEEPSEEK_API_KEY
    - name: glm-4-flash
      base_url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-flash
      api_key: ""
      api_key_env: ZHIPU_API_KEY
    - name: local-vllm-qwen
      base_url: http://127.0.0.1:8000/v1
      model: Qwen/Qwen2.5-7B-Instruct
      api_key: ""
      api_key_env: ""

memory:
  db_path: data/memory/events.db

proactive:
  output_dir: data/reports

web:
  host: 127.0.0.1
  port: 8765

voice:
  wake_names: ["Retina", "小光", "光光"]
  speak_feedback: true
  session_mode: true             # 唤醒后免唤醒连续对话
  session_duration_seconds: 60
  ui: qt                         # qt（新悬浮球）| ball（legacy）| none
  apps:
    微信: WeChat
    浏览器: msedge
    Edge: msedge
    Cursor: Cursor
    终端: wt
    代码: Cursor
  urls:
    百度: https://www.baidu.com
    谷歌: https://www.google.com
    GitHub: https://github.com
    知乎: https://www.zhihu.com
  sherpa:
    models_dir: models
    asr_model_dir: sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
    kws_model_dir: sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
    tts_model_dir: vits-zh-hf-fanchen-C
    tts_engine: sherpa            # sherpa（vits 女声）| pyttsx3（机器音兜底）
    kws_threshold: 0.4            # 0.35-0.5 逐词调；误触发高就调大
    keywords: ["小光", "光光"]     # KWS 唤醒词（中文）；Retina 等英文词靠 idle_asr 转写兜底
    num_threads: 1
    mic_device: null              # 声卡设备序号，null=系统默认；启动日志会枚举所有输入设备
    idle_asr: false               # true = 待机时双开 ASR 转写（支持英文唤醒词，CPU 占用更高）
    audio_source: null            # 调试用：wav 文件路径代替麦克风（如 data/test_wake_xiaoguang.wav）
